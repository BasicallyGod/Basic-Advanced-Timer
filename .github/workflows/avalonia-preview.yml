name: Avalonia migration preview

on:
  push:
    branches: [migration]
  pull_request:
    branches: [migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test standalone updater without network or launching an application
        if: runner.os == 'Windows'
        shell: powershell
        run: ./migration/updater/Test-Updater.ps1
      - name: Build and test production views and themes
        env:
          TIMER_PREVIEW_DIR: ${{ runner.temp }}/avalonia-timer-previews
        run: dotnet test migration/tests/Timer.Desktop.Tests/Timer.Desktop.Tests.csproj --configuration Release --verbosity minimal
      - name: Upload rendered previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-previews-${{ matrix.os }}
          path: ${{ runner.temp }}/avalonia-timer-previews/*.png
          if-no-files-found: ignore
      - name: Publish self-contained Windows preview
        if: runner.os == 'Windows'
        run: dotnet publish migration/src/Timer.Desktop/Timer.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/windows-preview
      - name: Check the database library is in the published folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in 'Microsoft.Data.Sqlite.dll', 'SQLitePCLRaw.core.dll', 'e_sqlite3.dll') {
            if (-not (Test-Path "artifacts/windows-preview/$name")) { throw "$name is missing from the published preview, so the database cannot load." }
          }
      - name: Include preview instructions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item migration/README.md artifacts/windows-preview/README.md
          Copy-Item migration/Start-Demo.cmd artifacts/windows-preview/Start-Demo.cmd
          '{"schemaVersion":1,"testBuildArgument":"--test-build"}' | Set-Content artifacts/windows-preview/test-build-support.json
      - name: Check the published native executable starts and switches views
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $preview = Start-Process ./artifacts/windows-preview/BasicsAdvancedTimer.Preview.exe -ArgumentList '--smoke-test', '--test-build' -PassThru -RedirectStandardError "$env:RUNNER_TEMP/timer-native-error.log"
          if (-not $preview.WaitForExit(30000)) {
            $preview.Kill()
            throw 'Published preview did not finish its startup check.'
          }
          if ($preview.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP/timer-native-error.log" -ErrorAction SilentlyContinue
            Get-Content ./artifacts/windows-preview/migration-startup-error.log -ErrorAction SilentlyContinue
            throw "Published preview exited with code $($preview.ExitCode)."
          }
      - name: Check the isolated demo executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $demo = Start-Process ./artifacts/windows-preview/BasicsAdvancedTimer.Preview.exe -ArgumentList '--smoke-test', '--demo' -PassThru
          if (-not $demo.WaitForExit(30000)) {
            $demo.Kill()
            throw 'Demo did not finish its startup check.'
          }
          if ($demo.ExitCode -ne 0) { throw "Demo exited with code $($demo.ExitCode)." }
      - name: Upload portable Windows preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BasicsAdvancedTimer-Windows-preview
          path: artifacts/windows-preview/
          if-no-files-found: error
