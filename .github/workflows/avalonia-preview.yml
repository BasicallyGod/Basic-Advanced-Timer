name: Development builds (experimental and alpha)

on:
  push:
    branches: [experimental, alpha]
  pull_request:
    branches: [experimental, alpha]
  workflow_dispatch:
    inputs:
      build_launcher:
        description: Include the Timer Branch Launcher download
        type: boolean
        default: false

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview-launcher:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.build_launcher)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Test preview installs and rollback offline
        shell: powershell
        run: ./app/preview-launcher/Test-UpdaterWorker.ps1
      - name: Publish standalone Windows launcher
        run: dotnet publish app/preview-launcher/TimerBranchLauncher.csproj --configuration Release -p:DebugType=None -o artifacts/preview-launcher
      - name: Check the packaged launcher opens
        shell: pwsh
        run: |
          $launcher = Start-Process -FilePath './artifacts/preview-launcher/Timer Branch Launcher.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $launcher.WaitForExit(30000)) {
            $launcher.Kill()
            throw 'The launcher did not finish its startup check.'
          }
          if ($launcher.ExitCode -ne 0) { throw "Launcher exited with code $($launcher.ExitCode)." }
      - name: Upload standalone Windows launcher
        if: github.event_name == 'workflow_dispatch' && inputs.build_launcher
        uses: actions/upload-artifact@v6
        with:
          name: Timer-Branch-Launcher-Windows
          path: artifacts/preview-launcher/Timer Branch Launcher.exe
          if-no-files-found: error
          retention-days: 14
  shell-checks:
    # Reads the shared Timer.Core and Timer.Storage packages from GitHub Packages.
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest] # Linux and macOS are left out for now; add ubuntu-latest and macos-latest back to run the tests there.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build and test production views and themes
        env:
          TIMER_PREVIEW_DIR: ${{ runner.temp }}/avalonia-timer-previews
        run: dotnet test app/tests/Timer.Desktop.Tests/Timer.Desktop.Tests.csproj --configuration Release --verbosity minimal --logger trx --results-directory "${{ runner.temp }}/avalonia-timer-results"
      - name: Report failed tests in check annotations
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "${{ runner.temp }}/avalonia-timer-results" -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$report = Get-Content $_.FullName -Raw
            foreach ($result in $report.SelectNodes("//*[local-name()='UnitTestResult'][@outcome='Failed']")) {
              $title = $result.testName.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(',', '%2C')
              $message = $result.Output.ErrorInfo.InnerText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=${title}::${message}"
            }
          }
      # The pictures are only worth keeping when a test failed, so a green run leaves nothing behind. A manual run (Run workflow) keeps them too.
      - name: Upload rendered previews
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: avalonia-previews-${{ matrix.os }}
          path: ${{ runner.temp }}/avalonia-timer-previews/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish self-contained Windows preview
        if: runner.os == 'Windows'
        run: dotnet publish app/src/Timer.Desktop/Timer.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:BuildChannel=${{ github.ref_name }} -p:Version=0.1.${{ github.run_number }} -p:InformationalVersion=0.1.${{ github.run_number }}+${{ github.sha }} -o artifacts/windows-preview
      - name: Check the database library is in the published folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in 'Microsoft.Data.Sqlite.dll', 'SQLitePCLRaw.core.dll', 'e_sqlite3.dll') {
            if (-not (Test-Path "artifacts/windows-preview/$name")) { throw "$name is missing from the published preview, so the database cannot load." }
          }
      - name: Include preview instructions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item app/README.md artifacts/windows-preview/README.md
          Copy-Item app/Start-Demo.cmd artifacts/windows-preview/Start-Demo.cmd
          '{"schemaVersion":1,"testBuildArgument":"--test-build"}' | Set-Content artifacts/windows-preview/test-build-support.json
      - name: Check the published native executable starts and switches views
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $preview = Start-Process ./artifacts/windows-preview/BasicsAdvancedTimer.Preview.exe -ArgumentList '--smoke-test', '--test-build' -PassThru -RedirectStandardError "$env:RUNNER_TEMP/timer-native-error.log"
          if (-not $preview.WaitForExit(30000)) {
            $preview.Kill()
            throw 'Published preview did not finish its startup check.'
          }
          if ($preview.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP/timer-native-error.log" -ErrorAction SilentlyContinue
            Get-Content ./artifacts/windows-preview/migration-startup-error.log -ErrorAction SilentlyContinue
            throw "Published preview exited with code $($preview.ExitCode)."
          }
      - name: Check the isolated demo executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $demo = Start-Process ./artifacts/windows-preview/BasicsAdvancedTimer.Preview.exe -ArgumentList '--smoke-test', '--demo' -PassThru
          if (-not $demo.WaitForExit(30000)) {
            $demo.Kill()
            throw 'Demo did not finish its startup check.'
          }
          if ($demo.ExitCode -ne 0) { throw "Demo exited with code $($demo.ExitCode)." }
      - name: Upload experimental Windows build
        if: runner.os == 'Windows' && github.ref_name == 'experimental' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: BasicsAdvancedTimer-Windows-experimental
          path: artifacts/windows-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Upload alpha Windows build
        if: runner.os == 'Windows' && github.ref_name == 'alpha' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: BasicsAdvancedTimer-Windows-alpha
          path: artifacts/windows-preview/
          if-no-files-found: error
          retention-days: 14
      # A manual run on any other branch keeps its own ZIP, so a feature branch can be tried without merging it first.
      - name: Name the feature-branch build
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && github.ref_name != 'experimental' && github.ref_name != 'alpha'
        id: branchname
        shell: pwsh
        run: '"name=$($env:GITHUB_REF_NAME -replace ''[^A-Za-z0-9._-]'', ''-'')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'
      - name: Upload feature-branch Windows build
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && github.ref_name != 'experimental' && github.ref_name != 'alpha'
        uses: actions/upload-artifact@v6
        with:
          name: BasicsAdvancedTimer-Windows-${{ steps.branchname.outputs.name }}
          path: artifacts/windows-preview/
          if-no-files-found: error
          retention-days: 7
