name: Avalonia migration preview

on:
  push:
    branches: [migration]
  pull_request:
    branches: [migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test production views and themes
        env:
          TIMER_PREVIEW_DIR: ${{ runner.temp }}/avalonia-timer-previews
        run: dotnet test migration/tests/Timer.Desktop.Tests/Timer.Desktop.Tests.csproj --configuration Release --verbosity minimal
      - name: Upload rendered previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-previews-${{ matrix.os }}
          path: ${{ runner.temp }}/avalonia-timer-previews/*.png
          if-no-files-found: ignore
      - name: Publish self-contained Windows preview
        if: runner.os == 'Windows'
        run: dotnet publish migration/src/Timer.Desktop/Timer.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/windows-preview
      - name: Include preview instructions
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item migration/README.md artifacts/windows-preview/README.md
      - name: Upload portable Windows preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BasicsAdvancedTimer-Windows-preview
          path: artifacts/windows-preview/
          if-no-files-found: error
