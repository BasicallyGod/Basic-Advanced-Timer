name: PowerShell checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate timeline, accounting and settings migration
        shell: powershell
        run: |
          ./tests/timeline-projection.ps1
          ./tests/decimal-reconciliation.ps1
          ./tests/settings-migration.ps1
