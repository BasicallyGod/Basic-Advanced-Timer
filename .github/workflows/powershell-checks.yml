name: PowerShell checks

on:
  pull_request:
    branches: [main, experimental]
  push:
    branches: [main, experimental]

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Timeline projection tests
        shell: powershell
        run: ./tests/timeline-projection.ps1
      - name: Decimal reconciliation tests
        shell: powershell
        run: ./tests/decimal-reconciliation.ps1
      - name: Settings migration tests
        shell: powershell
        run: ./tests/settings-migration.ps1
      - name: Day control tests
        shell: powershell
        run: ./tests/day-controls.ps1
      - name: Renderer layout tests
        shell: powershell
        run: ./tests/renderer-layout.ps1
      - name: Tidy day tests
        shell: powershell
        run: ./tests/tidy-day.ps1
      - name: Upload dashboard previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-previews
          path: ${{ runner.temp }}/timer-dashboard-previews/*.png
          if-no-files-found: ignore
