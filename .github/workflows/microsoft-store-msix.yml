name: Microsoft Store MSIX (development)

on:
  push:
    branches: [feature/microsoft-store-packaging]
  pull_request:
    branches: [migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix-dev:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run desktop tests
        run: dotnet test migration/tests/Timer.Desktop.Tests/Timer.Desktop.Tests.csproj --configuration Release --verbosity minimal
      - name: Package and sign temporary development MSIX
        shell: pwsh
        run: ./migration/packaging/build-msix.ps1 -BuildNumber ${{ github.run_number }} -OutputDirectory artifacts/msix
      - name: Upload development installer and public certificate
        uses: actions/upload-artifact@v4
        with:
          name: BasicsAdvancedTimer-MSIX-dev
          path: |
            artifacts/msix/BasicsAdvancedTimer-Dev.msix
            artifacts/msix/BasicsAdvancedTimer-Dev.cer
          if-no-files-found: error
