name: Microsoft Store MSIX packaging

on:
  push:
    branches: [feature/microsoft-store-packaging, migration, main]
  pull_request:
    branches: [migration, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix-dev:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run desktop tests
        run: dotnet test migration/tests/Timer.Desktop.Tests/Timer.Desktop.Tests.csproj --configuration Release --verbosity minimal
      - name: Package and sign temporary development MSIX
        shell: pwsh
        run: ./migration/packaging/build-msix.ps1 -BuildNumber ${{ github.run_number }} -OutputDirectory artifacts/msix
      - name: Upload development installer and public certificate
        uses: actions/upload-artifact@v4
        with:
          name: BasicsAdvancedTimer-MSIX-dev
          path: |
            artifacts/msix/BasicsAdvancedTimer-Dev.msix
            artifacts/msix/BasicsAdvancedTimer-Dev.cer
          if-no-files-found: error
      - name: Package unsigned Microsoft Store candidate
        shell: pwsh
        env:
          STORE_PACKAGE_NAME: Basically.BasicsAdvancedTimer
          STORE_PUBLISHER: CN=BF422802-B4CA-4B00-A09A-2EDA3315C0DE
          STORE_PUBLISHER_DISPLAY_NAME: Basically
        run: |
          ./migration/packaging/build-msix.ps1 `
            -BuildNumber ${{ github.run_number }} `
            -OutputDirectory artifacts/msix `
            -UnsignedForStore `
            -PackageName $env:STORE_PACKAGE_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - name: Upload Store candidate MSIX (not a signed sideload build)
        uses: actions/upload-artifact@v4
        with:
          name: BasicsAdvancedTimer-MSIX-Store
          path: artifacts/msix/BasicsAdvancedTimer-Store-unsigned.msix
          if-no-files-found: error
