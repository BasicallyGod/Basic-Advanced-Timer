name: Repeat the tests (manual)

# Runs the whole test suite many times on one build, to find tests that fail now and then, says which tests failed in which runs, and prints the
# first lines of each failure. Nothing is published. Start it by hand (Run workflow), which GitHub offers once this file is on main. Until then a pull
# request that changes this file runs it too, with the default number of runs (so a small edit to this file is the way to repeat the tests of a branch).
on:
  workflow_dispatch:
    inputs:
      times:
        description: How many times to run the whole suite
        default: '8'
  pull_request:
    paths:
      - '.github/workflows/test-repeat.yml'

permissions:
  contents: read

# Reads the shared Timer.Core and Timer.Storage packages from GitHub Packages (see app/NuGet.config).
env:
  PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

jobs:
  repeat:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the tests once
        run: dotnet build app/tests/Timer.Desktop.Tests/Timer.Desktop.Tests.csproj --configuration Release
      - name: Run the suite again and again
        shell: pwsh
        run: |
          $times = [int]('${{ inputs.times }}' -replace '[^0-9]', '')
          if ($times -lt 1) { $times = 8 }
          $seen = @{}
          $badRuns = @()
          for ($i = 1; $i -le $times; $i++) {
            $results = Join-Path $env:RUNNER_TEMP ("timer-tests-" + [guid]::NewGuid())
            $out = dotnet test app/tests/Timer.Desktop.Tests/Timer.Desktop.Tests.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=results.trx" --results-directory $results 2>&1 | Out-String -Stream
            $runExit = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            $failed = @()
            $total = 0
            try {
              [xml]$trx = Get-Content -Raw (Join-Path $results 'results.trx') -ErrorAction Stop
              $counters = $trx.GetElementsByTagName('Counters') | Select-Object -First 1
              if ($null -eq $counters -or [int]$counters.total -le 0) { throw 'No tests were reported.' }
              $total = [int]$counters.total
              $failed = @($trx.GetElementsByTagName('UnitTestResult') | Where-Object outcome -eq 'Failed' | ForEach-Object testName | Sort-Object -Unique)
              if ([int]$counters.failed -gt 0 -or [int]$counters.error -gt 0 -or [int]$counters.executed -eq 0 -or $failed.Count -gt 0) { $runExit = 1 }
            }
            catch {
              Write-Host "Run ${i}: invalid or missing test results: $($_.Exception.Message)"
              $runExit = 1
            }
            if ($runExit -ne 0) { $badRuns += $i }
            Write-Host "Run $i of ${times}: exit $runExit, $($failed.Count) failed of $total"
            foreach ($name in $failed) {
              if (-not $seen.ContainsKey($name)) { $seen[$name] = @() }
              $seen[$name] += $i
            }
          }
          $summary = "## Test repeat: $times runs`n"
          if ($badRuns.Count -eq 0) { $summary += "`nEvery run passed.`n" }
          else {
            $summary += "`nFailed or incomplete runs: $($badRuns -join ', ').`n"
            foreach ($name in $seen.Keys | Sort-Object) { $summary += "`n- ``$name`` failed in run(s) $($seen[$name] -join ', ') of $times" }
          }
          Write-Host $summary
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($badRuns.Count -gt 0) { exit 1 }
          exit 0
