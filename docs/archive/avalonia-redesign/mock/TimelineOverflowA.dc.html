<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Four or more blocks: pick from the list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pg{--bg1:#0F1420;--bg2:#131A2A;--ink:#EEF2FB;--muted:#A7B2CA;--line:#2D3853;--card:#1A2234;--card2:#212B42;--accent:#7C9BFF;color-scheme:dark;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Inter',system-ui,sans-serif;box-sizing:border-box}
.pg h1{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;font-weight:700}
.pg .lead{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.pg .cols{display:flex;gap:30px;align-items:flex-start}
.pg .cell{display:flex;flex-direction:column;gap:10px;margin:0;width:600px}
.pg .cap{display:flex;flex-direction:column;gap:3px}
.pg .cap h2{margin:0;font-size:15px;font-weight:600}
.pg .cap p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.pg .tag{display:inline-block;min-width:22px;text-align:center;margin-right:8px;padding:1px 6px;border-radius:7px;background:rgba(124,155,255,.18);color:#B9C9FF;font-size:12px;font-weight:700}
.strip{position:relative;width:600px;box-sizing:border-box;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.hr{position:absolute;top:10px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.ax{position:absolute;left:0;right:0;top:34px;height:1px;background:var(--line)}
.gd{position:absolute;top:35px;bottom:0;width:1px;background:rgba(255,255,255,.06)}
.gd.half{background:rgba(255,255,255,.03)}
.mt{position:absolute;box-sizing:border-box;border-radius:12px;background:rgba(255,255,255,.10);color:var(--ink);padding:6px 10px;left:60px;top:42px;width:276px;height:48px;overflow:hidden;white-space:nowrap}
.mt b{display:flex;align-items:center;gap:5px;font-size:12.5px;line-height:17px;font-weight:600}
.mt span{display:block;font-size:11px;line-height:15px;color:var(--muted)}
.pl{position:absolute;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 8px;height:21px;border-radius:8px;color:var(--ink);font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden}
.pl .in{background:rgba(238,242,251,.19);border-radius:6px;padding:1px 5px;font-size:10.5px;line-height:14px}
.b1{left:48px;top:104px;width:148px;background:color-mix(in srgb,#94BF9B 45%,#1A2234)}
.b2{left:104px;top:129px;width:181px;background:color-mix(in srgb,#C4A38F 45%,#1A2234)}
.b3{left:178px;top:154px;width:157px;background:color-mix(in srgb,#D79BB5 45%,#1A2234)}
.ghost{position:absolute;box-sizing:border-box;top:100px;height:80px;left:185px;width:117px;border:1.5px dashed #7C9BFF;border-radius:12px;background:rgba(124,155,255,.10)}
.ghost.sel{border-style:solid;background:rgba(124,155,255,.16)}
.chip{position:absolute;box-sizing:border-box;left:343px;top:104px;height:21px;border-radius:8px;display:flex;align-items:center;gap:4px;padding:0 8px;background:rgba(124,155,255,.18);border:1px solid rgba(124,155,255,.55);color:#B9C9FF;font-size:12px;font-weight:700}
.chip.sel{background:#7C9BFF;color:#0E1530;box-shadow:0 0 0 3px rgba(124,155,255,.35)}
.pop{position:absolute;box-sizing:border-box;left:318px;top:131px;width:268px;border-radius:16px;background:var(--card2);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.45);padding:8px;display:flex;flex-direction:column;gap:2px;z-index:5}
.pop .ph{font-size:11.5px;font-weight:600;color:var(--muted);padding:2px 8px 5px}
.pr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:9px;padding:7px 8px;border-radius:10px;font-size:12.5px;font-weight:600}
.pr.hov{background:rgba(255,255,255,.09)}
.pr .in{background:rgba(238,242,251,.19);border-radius:6px;padding:1px 5px;font-size:10.5px;font-weight:700;line-height:14px}
.pr i{font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted)}
.pr em{grid-column:2;grid-row:2;font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted)}
.sc{box-sizing:border-box;width:600px;border-radius:18px;background:var(--card);border:1px solid var(--line);padding:18px 20px 18px;display:flex;flex-direction:column;gap:14px}
.sc h3{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.sc h3 span{font-size:12px;font-weight:500;color:var(--muted)}
.flds{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.fld div{height:36px;box-sizing:border-box;border-radius:11px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;gap:7px;padding:0 12px;font-size:13.5px;color:var(--ink);font-weight:500}
.fld.wide{grid-column:1 / -1}
.btns{display:flex;gap:8px}
.btn{height:34px;box-sizing:border-box;border-radius:11px;border:1px solid var(--line);background:var(--card);padding:0 14px;display:flex;align-items:center;font-size:13px;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
</style>
</helmet>
<div class="pg" style="width: 1280px; height: 700px; padding: 34px 30px 30px; display: flex; flex-direction: column; gap: 22px; border-radius: 20px">
  <div>
    <h1>A · Pick from the list, edit in the card</h1>
    <p class="lead">Five blocks overlap from 11:29 to 11:44. Three keep their lanes; the other two fold into a +2 chip. Pressing it lists them, and choosing one selects it, so the Selected block card edits it with its Start, End and Length boxes.</p>
  </div>
  <div class="cols">

    <figure class="cell">
      <div class="cap"><h2><span class="tag">1</span>Press the chip</h2><p>The list names each folded block with its times. Pointing at a row outlines its time on the timeline.</p></div>
      <div class="strip" style="height: 276px">
        <span class="hr" style="left: 59px">11:00</span><span class="hr" style="left: 339px">12:00</span>
        <div class="ax"></div><div class="gd" style="left: 59px"></div><div class="gd half" style="left: 199px"></div><div class="gd" style="left: 339px"></div>
        <div class="mt"><b><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Client call</b><span>11:00–12:00</span></div>
        <div class="ghost"></div>
        <div class="pl b1"><span class="in">AT</span>00:33</div>
        <div class="pl b2"><span class="in">AS</span>00:40</div>
        <div class="pl b3"><span class="in">I</span>00:35</div>
        <div class="chip sel"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg>+2</div>
        <div class="pop">
          <span class="ph">2 more blocks</span>
          <div class="pr hov"><span class="in">AF</span><span>Account four</span><i>00:25</i><em>11:27–11:52</em></div>
          <div class="pr"><span class="in" style="background: rgba(238,242,251,.19)">NT</span><span>Northwind Traders</span><i>00:15</i><em>11:29–11:44</em></div>
        </div>
      </div>
    </figure>

    <figure class="cell">
      <div class="cap"><h2><span class="tag">2</span>It is selected</h2><p>The chip stays lit, the block's time is outlined, and the card shows the block. There are no drag handles on a folded block: its boxes do the moving.</p></div>
      <div class="strip" style="height: 210px">
        <span class="hr" style="left: 59px">11:00</span><span class="hr" style="left: 339px">12:00</span>
        <div class="ax"></div><div class="gd" style="left: 59px"></div><div class="gd half" style="left: 199px"></div><div class="gd" style="left: 339px"></div>
        <div class="mt"><b><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Client call</b><span>11:00–12:00</span></div>
        <div class="ghost sel"></div>
        <div class="pl b1"><span class="in">AT</span>00:33</div>
        <div class="pl b2"><span class="in">AS</span>00:40</div>
        <div class="pl b3"><span class="in">I</span>00:35</div>
        <div class="chip sel"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg>+2</div>
      </div>
      <div class="sc">
        <h3>Selected block<span>00:25 · Account four</span></h3>
        <div class="flds">
          <div class="fld">Account<div><span class="dot" style="background: #BAA4CE"></span>Account four</div></div>
          <div class="fld">Start<div>11:27</div></div>
          <div class="fld">End<div>11:52</div></div>
          <div class="fld">Length<div>00:25</div></div>
          <div class="fld wide">Note<div style="color: var(--muted)">No note</div></div>
        </div>
        <div class="btns"><span class="btn">Copy</span><span class="btn">Delete</span><span class="btn">Clear selection</span></div>
      </div>
    </figure>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
