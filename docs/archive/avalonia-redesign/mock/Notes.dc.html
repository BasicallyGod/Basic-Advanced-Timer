<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.root{--bg1:#F4F4F1;--bg2:#ECECE8;--card:#FFFFFF;--card2:#F7F7F5;--line:#E2E2DD;--ink:#18233A;--muted:#5A6070;--accent:#3558C8;--accentInk:#FFFFFF;--soft:#E8EEFF;--shadow:0 1px 2px rgba(30,30,20,.06);--rail1:#FFFFFF;--rail2:#F6F6F4;--railLine:#E2E2DD;--railIcon:#858994;--railOn:#D3DDF0;--railOnInk:#5A6070;--railHover:#EDEDEA;--railDivider:#E2E2DD;--clock:#18233A;--clockSec:#5A6070;--amber:#E07A10;--amberSoft:#FFF1D6;--flag:#C93A3A;--lateInk:#B3363F;--lateBg:#FDECEC;--scroll:#C9C9C4}
.root.dark{--bg1:#0F1420;--bg2:#131A2A;--card:#1A2234;--card2:#212B42;--line:#2D3853;--ink:#EEF2FB;--muted:#A7B2CA;--accent:#7C9BFF;--accentInk:#0E1530;--soft:#25335A;--shadow:0 1px 2px rgba(0,0,0,.25);--rail1:#1C2334;--rail2:#121826;--railLine:#2E3852;--railIcon:#C8D1E6;--railOn:#25335A;--railOnInk:#EEF2FB;--railHover:rgba(255,255,255,.10);--railDivider:#2E3852;--clock:#F3F6FF;--clockSec:#A9B5CF;--amber:#FF9A3C;--amberSoft:#3A2E14;--flag:#FF9A9A;--lateInk:#FF9A9A;--lateBg:#3A2226;--scroll:#46526F}
.root{color-scheme:light}.root.dark{color-scheme:dark}
:where(.root) button{font:inherit;color:inherit;cursor:pointer}
.root button:focus-visible,.root input:focus-visible,.root a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-size:14px;font-weight:500;text-decoration:none}
.ctl:hover{background:var(--card2)}
.ctl.small{height:30px;border-radius:10px;font-size:13px;padding:0 11px}
.ctl.primary{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.ctl.primary:hover{background:var(--accent);filter:brightness(1.06)}
.ctl:disabled{opacity:.5;cursor:not-allowed}
.nav{width:40px;height:40px;border-radius:13px;border:0;background:transparent;color:var(--railIcon);display:flex;align-items:center;justify-content:center;padding:0;text-decoration:none}
.nav:hover{background:var(--railHover);color:var(--ink)}
.nav.on{background:var(--railOn);color:var(--railOnInk)}
.nav.quit:hover{background:var(--lateBg);color:var(--lateInk)}
.nav.finish:hover .cloth{animation:wave 1.1s ease-in-out infinite}
.nav.finish .cloth{transform-box:fill-box;transform-origin:0 50%}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}25%{transform:skewY(-9deg) scaleX(.93)}50%{transform:skewY(0) scaleX(1.04)}75%{transform:skewY(9deg) scaleX(.93)}}
.play{width:44px;height:44px;border-radius:14px;border:0;padding:0;color:#10281F;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 2px rgba(20,30,60,.18);display:flex;align-items:center;justify-content:center}
.brk{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--amber);display:flex;align-items:center;justify-content:center;padding:0}
.brk:hover{background:var(--amberSoft)}
.root{--live:#1F8F5F;--ovt:#D9363E}
.root.dark{--live:#34D399;--ovt:#FF7A7A}
.play{--tone:var(--live);color:var(--tone);background:color-mix(in srgb,var(--tone) 20%,transparent);box-shadow:none;transition:background .15s ease}
.play:hover{background:color-mix(in srgb,var(--tone) 32%,transparent)}
.brk{background:color-mix(in srgb,var(--amber) 16%,transparent);transition:background .15s ease}
.brk:hover{background:color-mix(in srgb,var(--amber) 28%,transparent)}
.brk.on{background:var(--amber);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 32%,transparent)}
.root.dark .brk.on{color:#2A1A05}
.accT{background:color-mix(in srgb,var(--ink) 5%,transparent);transition:background .15s ease}
.accT:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.accT.open{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.brk:hover .steam{animation:steam 1.4s ease-in-out infinite}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-1.6px);opacity:.45}}
.dot{width:10px;height:10px;border-radius:50%;display:block}
.clockBtn{border:0;background:transparent;padding:6px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--clock);line-height:1}
.clockBtn:hover{background:var(--railHover)}
.field{height:36px;box-sizing:border-box;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px;padding:0 10px;font:400 14px 'Inter',system-ui,sans-serif;min-width:0;width:100%}
.field:disabled{opacity:.55}
.lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.iconbtn{background:transparent;border:0;color:var(--muted);width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.iconbtn:hover{background:var(--card2);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 8px;font-weight:500;white-space:nowrap}
.chip.late{color:var(--lateInk);background:var(--lateBg)}
.chip.plain{color:var(--ink);background:var(--card2);border:1px solid var(--line)}
.tick{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:1px 0 0;border-radius:50%;border:1.6px solid var(--muted);background:transparent;display:grid;place-content:center;cursor:pointer;flex-shrink:0;transition:background .15s,border-color .15s}
.tick:hover{border-color:var(--accent)}
.tick:checked{background:var(--accent);border-color:var(--accent)}
.tick:checked::after{content:"";width:5px;height:9px;border:solid var(--accentInk);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.vitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:12px;padding:8px 10px;text-align:left;font-size:14px;font-weight:500}
.vitem:hover{background:var(--card2)}
.vitem.on{background:var(--soft);color:var(--accent);font-weight:600}
.count{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500}
.vitem.on .count{color:var(--accent)}
.nmain{flex-grow:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px}
.nrow{display:flex;align-items:flex-start;gap:10px;padding:9px 10px 9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.nrow:hover{background:var(--card2)}
.sugg{position:absolute;left:0;right:0;top:62px;z-index:12;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 20px rgba(20,30,70,.14);padding:4px}
.sugg button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-size:13px;text-align:left}
.sugg button:hover{background:var(--card2)}
.selWrap{display:flex;align-items:center;gap:8px;height:36px;box-sizing:border-box;border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:0 6px 0 10px;width:100%;text-align:left}
.selWrap:hover{border-color:var(--accent)}
.selWrap:disabled{opacity:.55;cursor:default}
.msg{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.4}
.msgIcon{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:1.6px solid var(--ink);color:var(--ink)}
.opt{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:500;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calHead{font-size:11px;color:var(--muted);text-align:center;height:16px;line-height:16px;font-weight:600}
.day{height:26px;border:0;border-radius:50%;background:transparent;font-size:12.5px;color:var(--ink);padding:0;font-weight:500}
.day:hover{background:var(--soft)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.on{background:var(--accent);color:var(--accentInk)}
.day:disabled{color:var(--muted);opacity:.4;cursor:default;background:transparent}
.day.blank{visibility:hidden}
.stp{width:44px;height:20px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0}
.stp:hover{background:var(--card2);color:var(--ink)}
.tin{width:44px;height:30px;box-sizing:border-box;text-align:center;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;font:600 14px 'Inter',system-ui,sans-serif;padding:0}
.remindPop{position:absolute;left:332px;top:124px;width:404px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(20,30,70,.16);padding:12px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
/* One switch: a rounded track holding both choices, the chosen one filled with the accent. */
.seg{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;height:36px;box-sizing:border-box;padding:3px;background:var(--bg1);flex-shrink:0}
.segb{border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:500;color:var(--muted);padding:0 15px}
.segb:hover{background:rgba(110,120,150,.14);color:var(--ink)}
.segb.on,.segb.on:hover{background:var(--accent);color:var(--accentInk)}
.root *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.root *::-webkit-scrollbar{width:10px;height:10px}
.root *::-webkit-scrollbar-track{background:transparent}
.root *::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid transparent;background-clip:content-box}
.root *::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
@media (prefers-reduced-motion:reduce){.tick,.brk:hover .steam,.nav.finish:hover .cloth{transition:none;animation:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(96,150,255,.75)}70%{box-shadow:0 0 0 7px rgba(96,150,255,0)}100%{box-shadow:0 0 0 0 rgba(96,150,255,0)}}
.cap{width:6px;height:14px;border-radius:3px;display:block;flex-shrink:0}
.cap.pulse{animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.cap.pulse{animation:none}}
svg.ri{display:block;fill:currentColor}
.ri .tk,.ri .xa,.ri .xb{stroke-dashoffset:0}
.ri .xa,.ri .xb{opacity:0;stroke-dashoffset:10}
.ri .c{transform-box:fill-box;transform-origin:50% 100%}
@keyframes wigA{0%,100%{transform:translateX(0)}30%{transform:translateX(1.6px)}70%{transform:translateX(-1.6px)}}
@keyframes wigB{0%,100%{transform:translateX(0)}35%{transform:translateX(-1.6px)}75%{transform:translateX(1.4px)}}
@keyframes wigC{0%,100%{transform:translateX(0)}25%{transform:translateX(1.4px)}65%{transform:translateX(-1.7px)}}
@keyframes spring{0%{transform:scaleY(1)}10%{transform:scaleY(1.34)}22%{transform:scaleY(.94)}32%{transform:scaleY(1.08)}42%,100%{transform:scaleY(1)}}
@keyframes tkCycle{0%,3%{opacity:1;stroke-dashoffset:0}11%{opacity:0;stroke-dashoffset:0}56%{opacity:0;stroke-dashoffset:10}68%,100%{opacity:1;stroke-dashoffset:0}}
@keyframes xCycle{0%,10%{opacity:0;stroke-dashoffset:10}20%,48%{opacity:1;stroke-dashoffset:0}56%{opacity:0;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:10}}
@media (prefers-reduced-motion:no-preference){
.nav:hover .b1{animation:wigA 2.2s ease-in-out infinite}
.nav:hover .b2{animation:wigB 2.7s ease-in-out infinite}
.nav:hover .b3{animation:wigC 2.4s ease-in-out infinite}
.nav:hover .c1{animation:spring 2.6s ease-out infinite}
.nav:hover .c2{animation:spring 2.6s ease-out .45s infinite}
.nav:hover .c3{animation:spring 2.6s ease-out .9s infinite}
.nav:hover .tk{animation:tkCycle 3.2s ease-in-out infinite}
.nav:hover .xa{animation:xCycle 3.2s ease-in-out infinite}
.nav:hover .xb{animation:xCycle 3.2s ease-in-out .1s infinite}
}
/* the primary control and the Accounts button share one soft well, with the break below at the foot */
.well{width:54px;box-sizing:border-box;padding:4px;border-radius:20px;background:color-mix(in srgb,var(--ink) 5.5%,transparent);display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px}
.dark .well{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.well .play{width:46px;margin-top:0}
.well .accT{width:46px;background:transparent}
.well .accT:hover{background:var(--hover)}
.well .accT.open{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.dark .well .accT.open{background:color-mix(in srgb,var(--accent) 22%,transparent)}
</style>
</helmet>
<div class="root {{modeClass}}" style="width: 1100px; height: 720px; box-sizing: border-box; display: flex; position: relative; overflow: hidden; border-radius: 20px; background: linear-gradient(135deg, var(--bg1), var(--bg2)); font-family: 'Inter', system-ui, sans-serif; color: var(--ink)">

  <nav aria-label="Timer and navigation" style="width: 76px; flex-shrink: 0; height: 100%; box-sizing: border-box; padding: 14px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(180deg, var(--rail1), var(--rail2)); border-right: 1px solid var(--railLine)">
    <div style="display: flex; gap: 6px; align-items: center; height: 14px" role="group" aria-label="Recording and reminder status">
      <span class="cap" role="img" aria-label="Recording" style="background: #34D399"></span>
<span class="cap pulse" role="img" aria-label="A reminder is due" style="background: #6096FF"></span>
    </div>
    <button class="clockBtn" aria-label="Collapse to the pill. Working time 04:47:35" title="Collapse to the pill" style="margin-top: 4px">
      <span style="font-size: 30px; font-weight: 700">04</span>
      <span style="font-size: 30px; font-weight: 700; margin-top: 2px">47</span>
      <span style="font-size: 15px; font-weight: 600; margin-top: 4px; color: var(--clockSec)">35</span>
    </button>
    <div class="well">
    <button class="play" aria-label="Pause. Tracking Account five"><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 17px">A5</span></button>
    <button class="nav accT" aria-label="Switch account" title="Switch account" style="width: 46px; height: 44px; border-radius: 14px"><span style="display: flex; flex-direction: column; gap: 3px" aria-hidden="true"><span style="width: 20px; height: 5px; border-radius: 3px; background: linear-gradient(135deg,#A8D4FF,#7F98F7)"></span><span style="width: 20px; height: 5px; border-radius: 3px; background: linear-gradient(135deg,#B2EFD6,#5FD6AE)"></span><span style="width: 20px; height: 5px; border-radius: 3px; background: linear-gradient(135deg,#FFD9B8,#FF9F84)"></span></span></button>
    </div>
    <button class="brk" aria-label="Start break" title="Start break"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path class="steam" d="M8 3v2M12 3v2"/></svg></button>
    <div style="width: 30px; height: 1px; background: var(--railDivider); margin: 4px 0 2px"></div>
    <a class="nav" href="Main.dc.html" aria-label="Timeline" title="Timeline"><svg class="ri" width="22" height="22" viewBox="0 0 18 18" aria-hidden="true"><rect class="b1" x="2.5" y="3.6" width="8.5" height="3" rx="1.5"/><rect class="b2" x="6.5" y="7.6" width="9" height="3" rx="1.5"/><rect class="b3" x="4" y="11.6" width="6.5" height="3" rx="1.5"/></svg></a>
    <a class="nav on" href="Notes.dc.html" aria-label="Notes" aria-current="page" title="Notes"><svg class="ri" width="22" height="22" viewBox="0 0 18 18" aria-hidden="true"><defs><mask id="mkn1a" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><path class="tk" pathLength="10" d="M3.2 5.05L4.6 6.45L6.9 3.65" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10"/></mask><mask id="mkn1b" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><path class="xa" pathLength="10" d="M3.9 12.1L6.1 14.3" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="10"/><path class="xb" pathLength="10" d="M6.1 12.1L3.9 14.3" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="10"/></mask></defs><rect x="1.8" y="2" width="6.4" height="6.4" rx="1.8" mask="url(#mkn1a)"/><rect x="1.8" y="10" width="6.4" height="6.4" rx="1.8" mask="url(#mkn1b)"/><path d="M10.4 5.2h5.2 M10.4 13.2h5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></a>
    <a class="nav" href="Week.dc.html" aria-label="Week overview" title="Week overview"><svg class="ri" width="22" height="22" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 15.8h14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><rect class="c c1" x="2.8" y="8.6" width="2.8" height="5.6" rx="1.4"/><rect class="c c2" x="7.6" y="4.6" width="2.8" height="9.6" rx="1.4"/><rect class="c c3" x="12.4" y="7" width="2.8" height="7.2" rx="1.4"/></svg></a>
    <div style="flex-grow: 1"></div>
    <button class="nav finish" aria-label="Finish day" title="Finish day" style="color: var(--flag)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path class="cloth" d="M5 5h13l-3 4 3 4H5"/></svg></button>
    <div style="width: 30px; height: 1px; background: var(--railDivider); margin: 2px 0"></div>
    <button class="nav quit" aria-label="Close timer" title="Close timer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </nav>

  <main style="flex-grow: 1; min-width: 0; padding: 20px 22px 20px 20px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <header style="display: flex; align-items: center; gap: 10px; height: 44px">
      <h1 style="margin: 0 auto 0 4px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">Notes</h1>
      <div style="position: relative; width: 240px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 11px; top: 11px; color: var(--muted)"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input class="field" type="text" value="{{q}}" onChange="{{onQ}}" aria-label="Search notes" placeholder="Search notes" style="height: 38px; padding-left: 34px">
      </div>
      <button class="ctl" aria-label="Notifications" style="width: 42px; padding: 0; position: relative"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>
        <sc-if value="{{hasOverdue}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; background: var(--lateInk); color: var(--card); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px">{{overdueCount}}</span></sc-if>
      </button>

    const toMin = (t) => parseInt(t.slice(0, 2), 10) * 60 + parseInt(t.slice(3, 5), 10);
    const fromMin = (m) => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
    const parseLen = (v) => { const t = String(v).trim(); let m = /^(\d+)[:.](\d{2})$/.exec(t); if (m) return +m[1] * 60 + +m[2]; m = /^(\d+)$/.exec(t); if (m) return +m[1]; return null; };
    const isOver = (n) => !n.done && !n.meet && !!n.time && (n.ts < todayTs || (n.ts === todayTs && n.time < nowT));
    const fail = (where, msg) => this.setState({ err: msg, errAt: where });
    const upd = (id, patch) => this.setState({ notes: st.notes.map((n) => (n.id === id ? { ...n, ...patch } : n)), err: '' });
    const startKey = (n) => (n.meet ? n.meet.s : n.time || '99:99');
    const suggMatch = /#([A-Za-z0-9_-]*)$/.exec(this.state.draft || '');
    const suggList = suggMatch ? accts.map((a, i) => ({ n: a.n, i: i })).filter((x) => x.n.replace(/\s/g, '').toLowerCase().startsWith(suggMatch[1].toLowerCase())).slice(0, 4) : [];
    const acctOpts = (cur, pick) => [{ name: 'No account', i: -1 }].concat(accts.map((a, i) => ({ name: a.n, i: i }))).map((o) => ({ name: o.name, on: cur === o.i, dot: dot(o.i, true), pick: () => pick(o.i) }));

    // ---- filter and group
    const matches = (n) => {
      if (st.acctF >= 0 && n.acct !== st.acctF) return false;
      if (st.q.trim() && n.text.toLowerCase().indexOf(st.q.trim().toLowerCase()) < 0) return false;
      return true;
    };
    const inView = (n) => (st.view === 'today' ? n.ts === todayTs : st.view === 'overdue' ? isOver(n) : st.view === 'upcoming' ? n.ts > todayTs && !n.done : st.view === 'meetings' ? !!n.meet : st.view === 'done' ? n.done : true);
    const base = st.notes.filter(matches);
    const count = (f) => base.filter(f).length;
    const viewDefs = [
      ['all', 'All', base.length], ['today', 'Today', count((n) => n.ts === todayTs)], ['overdue', 'Overdue', count(isOver)],
      ['upcoming', 'Upcoming', count((n) => n.ts > todayTs && !n.done)], ['meetings', 'Meetings', count((n) => !!n.meet)], ['done', 'Done', count((n) => n.done)]
    ];
    const views = viewDefs.map((v) => ({ name: v[1], count: v[2], on: st.view === v[0], cls: st.view === v[0] ? 'vitem on' : 'vitem', pick: () => this.setState({ view: v[0], scopeOpen: false }) }));
    const accountFilters = accts.map((a, i) => ({
      name: a.n, dot: dot(i), count: st.notes.filter((n) => n.acct === i).length, on: st.acctF === i,
      cls: st.acctF === i ? 'vitem on' : 'vitem', pick: () => this.setState({ acctF: st.acctF === i ? -1 : i })
    }));
    const shown = base.filter(inView);
    const byTime = (p, q) => p.ts - q.ts || (startKey(p) < startKey(q) ? -1 : startKey(p) > startKey(q) ? 1 : 0);
    const groups = [];
    const over = shown.filter(isOver).sort(byTime);
    const open = shown.filter((n) => !isOver(n) && !n.done).sort(byTime);
    const done = shown.filter((n) => n.done).sort((p, q) => q.ts - p.ts);
    if (over.length) groups.push({ label: 'Overdue', list: over, bad: true });
    const days = [];
    open.filter((n) => n.ts >= todayTs).forEach((n) => { if (days.indexOf(n.ts) < 0) days.push(n.ts); });
    days.forEach((ts) => groups.push({ label: dayLabel(ts) + (ts === todayTs || ts === addDays(todayTs, 1) ? ' · ' + dateText(ts) : ''), list: open.filter((n) => n.ts === ts) }));
    const earlier = open.filter((n) => n.ts < todayTs);
    if (earlier.length) groups.push({ label: 'Earlier', list: earlier });
    if (done.length) groups.push({ label: 'Done', list: done });

    const resetForm = () => ({ editId: null, draft: '', draftAcct: -1, draftRem: null, draftLen: '00:30', draftRepeat: 'none', kind: 'note', scope: null, scopeId: null, err: '', accDd: false, cRepDd: false, popOpen: false });
    const askDelete = (id) => {
      const n = st.notes.find((q) => q.id === id);
      if (n && n.meet && n.repeat !== 'none') { this.setState({ scope: 'delete', scopeId: id, accDd: false, cRepDd: false, popOpen: false }); return; }
      this.setState({ notes: st.notes.filter((q) => q.id !== id), ...(st.editId === id ? resetForm() : {}), err: '' });
    };
    const loadEdit = (id) => {
      const n = st.notes.find((q) => q.id === id);
      if (!n) return;
      this.setState({ editId: id, kind: n.meet ? 'meeting' : 'note', draft: n.text, draftAcct: n.acct,
        draftRem: n.meet ? { ts: n.ts, t: n.meet.s } : n.time ? { ts: n.ts, t: n.time } : null,
        draftLen: n.meet ? fromMin(toMin(n.meet.e) - toMin(n.meet.s)) : '00:30', draftRepeat: n.repeat, scope: null, err: '', accDd: false, cRepDd: false, popOpen: false });
    };
    const applyEdit = () => {
      const n = st.notes.find((q) => q.id === st.editId);
      if (!n) return;
      const text = st.draft.trim();
      const patch = n.meet
        ? { text: text, acct: st.draftAcct, ts: st.draftRem.ts, meet: { s: st.draftRem.t, e: fromMin(toMin(st.draftRem.t) + cLen) }, repeat: st.draftRepeat }
        : { text: text, acct: st.draftAcct, ts: st.draftRem ? st.draftRem.ts : n.ts, time: st.draftRem ? st.draftRem.t : '' };
      this.setState({ notes: st.notes.map((q) => (q.id === n.id ? { ...q, ...patch } : q)), ...resetForm() });
    };
    const blank = { isHead: false, isRow: false, isRem: false, isNote: false, isMeet: false, done: false, text: '', textStyle: '', rowStyle: '', hasAcct: false, acctName: '', acctDot: '', hasTime: false, timeText: '', timeCls: '', hasRep: false, repText: '', aria: '', open: '', removeLabel: '', label: '', count: 0, headStyle: '', toggle: () => {}, pick: () => {}, remove: () => {} };
    const rows = [];
    groups.forEach((g) => {
      rows.push({ ...blank, isHead: true, label: g.label, count: g.list.length, headStyle: 'padding: 8px 2px 2px;' + (g.bad ? 'color:var(--lateInk)' : '') });
      g.list.forEach((n) => {
        const over1 = isOver(n);
        rows.push({
          ...blank, isHead: false, isRow: true, isNote: !n.meet, isMeet: !!n.meet, done: n.done,
          text: n.text,
          textStyle: 'font-size:14px;line-height:1.35;font-weight:' + (n.meet ? 600 : 500) + ';' + (n.done ? 'text-decoration:line-through;color:var(--muted)' : 'color:var(--ink)'),
          rowStyle: st.editId === n.id ? 'box-shadow:inset 3px 0 0 var(--accent);background:var(--card2)' : '',
          hasAcct: n.acct >= 0, acctName: n.acct >= 0 ? '#' + accts[n.acct].n.replace(/\s/g, '') : '', acctDot: dot(n.acct),
          hasTime: !!(n.meet || n.time), timeText: dayLabel(n.ts) + ', ' + (n.meet ? n.meet.s + '–' + n.meet.e : n.time), isRem: !n.meet, timeCls: over1 ? 'chip late' : n.meet ? 'chip plain' : 'chip',
          hasRep: n.meet ? n.repeat !== 'none' : !!n.arch, repText: n.meet ? repText(n.repeat) : 'Repeats every week',
          aria: 'Done: ' + n.text, open: 'Open ' + n.text, removeLabel: n.meet ? 'Delete meeting' : 'Delete note',
          toggle: () => upd(n.id, { done: !n.done }),
          pick: () => loadEdit(n.id),
          remove: () => askDelete(n.id)
        });
      });
    });

    // ---- the reminder and time pop-up, the same as on the Timeline
    const pm = new Date(2026, 9 + st.popMonth, 1);
    const first = (pm.getDay() + 6) % 7;
    const dim = new Date(pm.getFullYear(), pm.getMonth() + 1, 0).getDate();
    const calCells = [];
    for (let i = 0; i < 42; i++) {
      const day = i - first + 1;
      if (day < 1 || day > dim) { calCells.push({ label: '', cls: 'day blank', off: true, on: false, aria: '', pick: () => {} }); continue; }
      const ts = new Date(pm.getFullYear(), pm.getMonth(), day).getTime();
      const on = ts === st.popTs;
      calCells.push({ label: String(day), cls: 'day' + (on ? ' on' : '') + (ts === todayTs ? ' today' : ''), off: ts < todayTs, on: on, aria: day + ' ' + monFull[pm.getMonth()], pick: () => this.setState({ popTs: ts }) });
    }
    const quick = [{ name: 'Today', ts: todayTs }, { name: 'Tomorrow', ts: addDays(todayTs, 1) }, { name: 'Next Mon', ts: new Date(2026, 9, 26).getTime() }];
    const popTime = pad(st.popH) + ':' + pad(st.popM);
    const popLate = st.popTs === todayTs && popTime < nowT;
    const stepH = (d) => () => this.setState({ popH: (st.popH + d + 24) % 24 });
    const stepM = (d) => () => this.setState({ popM: (Math.round(st.popM / 5) * 5 + d + 60) % 60 });
    const targetNote = st.editId ? st.notes.find((n) => n.id === st.editId) : null;
    const popIsMeet = st.kind === 'meeting';
    const openPop = () => {
      const rem = st.draftRem;
      const ts = rem ? rem.ts : todayTs;
      const t = rem && rem.t ? rem.t : '12:00';
      this.setState({ popOpen: true, popTs: ts, popMonth: monthOffset(ts), popH: +t.slice(0, 2), popM: +t.slice(3, 5), accDd: false, cRepDd: false });
    };
    const setPop = () => this.setState({ draftRem: { ts: st.popTs, t: popTime }, popOpen: false, err: '' });
    const clearPop = () => this.setState({ draftRem: null, popOpen: false });

    // ---- the add box
    const cLen = parseLen(st.draftLen) || 30;
    const cWhen = st.kind === 'meeting'
      ? (st.draftRem ? dayLabel(st.draftRem.ts) + ' ' + st.draftRem.t + '–' + fromMin(Math.min(23 * 60 + 59, toMin(st.draftRem.t) + cLen)) : 'Pick a time')
      : (st.draftRem ? dayLabel(st.draftRem.ts) + ' ' + st.draftRem.t : 'Reminder');

    const overdueCount = st.notes.filter(isOver).length;
    return {
      modeClass: mode === 'dark' ? 'dark' : '',
      q: st.q, onQ: (e) => this.setState({ q: e.target.value }),
      hasOverdue: overdueCount > 0, overdueCount: overdueCount,
      views: views, accountFilters: accountFilters,
      // add box
      draft: st.draft, onDraft: (e) => this.setState({ draft: e.target.value }),
      // A # word at the end of the box offers the accounts; choosing one sets the account and takes the word out.
      hasSugg: suggList.length > 0,
      sugg: suggList.map((x) => ({ tag: '#' + x.n.replace(/\s/g, ''), name: x.n, dot: dot(x.i, true), pick: () => this.setState({ draftAcct: x.i, draft: st.draft.slice(0, suggMatch.index).trimEnd() }) })),
      isNoteKind: st.kind === 'note', isMeetKind: st.kind === 'meeting',
      noteCls: st.kind === 'note' ? 'segb on' : 'segb', meetCls: st.kind === 'meeting' ? 'segb on' : 'segb',
      kindNote: () => this.setState({ kind: 'note', err: '' }), kindMeet: () => this.setState({ kind: 'meeting', err: '' }),
      draftAria: st.kind === 'meeting' ? 'Meeting name' : 'New note', draftHint: st.kind === 'meeting' ? 'Meeting name' : 'Write a note',
      cAcctName: st.draftAcct >= 0 ? accts[st.draftAcct].n : 'No account', cAcctDot: dot(st.draftAcct, true),
      accDd: st.accDd, toggleAccDd: () => this.setState({ accDd: !st.accDd, cRepDd: false }),
      cAcctOpts: acctOpts(st.draftAcct, (i) => this.setState({ draftAcct: i, accDd: false })),
      cWhen: cWhen, cWhenAria: st.kind === 'meeting' ? 'Pick the day and start time' : 'Add a reminder',
      openNewPop: () => openPop(),
      draftLen: st.draftLen,
      onDraftLen: (e) => { const l = parseLen(e.target.value); if (l == null || l <= 0) { fail('c', 'Length looks like 1:00, or 45 for minutes.'); return; } this.setState({ draftLen: fromMin(l), err: '' }); },
      cRepDd: st.cRepDd, toggleCRep: () => this.setState({ cRepDd: !st.cRepDd, accDd: false }),
      cRepLabel: repText(st.draftRepeat),
      cRepOpts: repOptions.map((o) => ({ label: o[1], on: st.draftRepeat === o[0], pick: () => this.setState({ draftRepeat: o[0], cRepDd: false }) })),
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const text = st.draft.trim();
        if (!text) { fail('c', st.kind === 'meeting' ? 'Give the meeting a name.' : 'Write something first.'); return; }
        if (st.editId) {
          if (st.kind === 'meeting') {
            if (!st.draftRem) { fail('c', 'Pick the day and start time.'); return; }
            if (toMin(st.draftRem.t) + cLen > 23 * 60 + 59) { fail('c', 'A meeting has to end before midnight.'); return; }
            const old = st.notes.find((q) => q.id === st.editId);
            if (old && old.repeat !== 'none') { this.setState({ scope: 'save' }); return; }
          }
          applyEdit();
          return;
        }
        const id = st.nextId;
        let note;
        if (st.kind === 'meeting') {
          if (!st.draftRem) { fail('c', 'Pick the day and start time.'); return; }
          const endM = toMin(st.draftRem.t) + cLen;
          if (endM > 23 * 60 + 59) { fail('c', 'A meeting has to end before midnight.'); return; }
          note = { id: id, text: text, acct: st.draftAcct, ts: st.draftRem.ts, time: '', done: false, meet: { s: st.draftRem.t, e: fromMin(endM) }, repeat: st.draftRepeat };
        } else note = { id: id, text: text, acct: st.draftAcct, ts: st.draftRem ? st.draftRem.ts : todayTs, time: st.draftRem ? st.draftRem.t : '', done: false, meet: null, repeat: 'none' };
        this.setState({ nextId: id + 1, draft: '', draftAcct: -1, draftRem: null, draftRepeat: 'none', err: '', notes: [...st.notes, note] });
      },
      rows: rows, emptyList: rows.length === 0,
      emptyText: st.q.trim() ? 'Nothing matches that search.' : st.view === 'overdue' ? 'Nothing is overdue.' : 'Nothing here yet.',
      hasErrC: st.err !== '', err: st.err,
      isEditing: !!st.editId, notEditing: !st.editId,
      archEdit: !!targetNote && !!targetNote.arch,
      canSubmit: !(targetNote && targetNote.arch),
      editLabel: st.kind === 'meeting' ? 'Editing a meeting' : 'Editing a note',
      submitLabel: st.editId ? 'Save' : 'Add',
      deleteEdit: () => askDelete(st.editId),
      cancelEdit: () => this.setState(resetForm()),
      scopeOpen: st.scope !== null,
      scopeTitle: st.scope === 'delete' ? 'Delete a repeating meeting' : 'Change a repeating meeting',
      scopeOne: () => { if (st.scope === 'save') applyEdit(); else this.setState({ notes: st.notes.filter((q) => q.id !== st.scopeId), ...(st.editId === st.scopeId ? resetForm() : { scope: null }) }); },
      scopeAll: () => { if (st.scope === 'save') applyEdit(); else this.setState({ notes: st.notes.filter((q) => q.id !== st.scopeId), ...(st.editId === st.scopeId ? resetForm() : { scope: null }) }); },
      scopeCancel: () => this.setState({ scope: null }),
      // the pop-up
      popOpen: st.popOpen, popLabel: popIsMeet ? 'When' : 'Reminder', popCanRemove: !popIsMeet,
      popFor: st.draft.trim() || (st.kind === 'meeting' ? 'New meeting' : 'New note'),
      closePop: () => this.setState({ popOpen: false }),
      calTitle: monFull[pm.getMonth()] + ' ' + pm.getFullYear(), calCells: calCells,
      prevOff: st.popMonth <= 0,
      calPrev: () => this.setState({ popMonth: Math.max(0, st.popMonth - 1) }),
      calNext: () => this.setState({ popMonth: Math.min(12, st.popMonth + 1) }),
      popDays: quick.map((q) => ({ name: q.name, on: st.popTs === q.ts, cls: st.popTs === q.ts ? 'opt on' : 'opt', pick: () => this.setState({ popTs: q.ts, popMonth: monthOffset(q.ts) }) })),
      popTimes: ['09:00', '12:00', '15:00', '17:00'].map((t) => ({ name: t, on: popTime === t, cls: popTime === t ? 'opt on' : 'opt', pick: () => this.setState({ popH: +t.slice(0, 2), popM: +t.slice(3, 5) }) })),
      popHStr: pad(st.popH), popMStr: pad(st.popM),
      hUp: stepH(1), hDown: stepH(-1), mUp: stepM(5), mDown: stepM(-5),
      onH: (e) => { const v = parseInt(e.target.value, 10); if (v >= 0 && v <= 23) this.setState({ popH: v }); },
      onM: (e) => { const v = parseInt(e.target.value, 10); if (v >= 0 && v <= 59) this.setState({ popM: v }); },
      popSummary: dayLabel(st.popTs) + ', ' + popTime,
      popSummaryStyle: 'font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' + 'color:var(--ink)',
      setRemind: setPop, clearRemind: clearPop
    };
  }
}
</script>
</body>
