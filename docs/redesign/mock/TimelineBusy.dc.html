<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stacked meetings on a busy day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pg{--bg1:#0F1420;--bg2:#131A2A;--ink:#EEF2FB;--muted:#A7B2CA;--line:#2D3853;--card:#1A2234;--card2:#212B42;--accent:#7C9BFF;--accentInk:#0E1530;color-scheme:dark;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Inter',system-ui,sans-serif;box-sizing:border-box}
.pg h1{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;font-weight:700}
.pg .lead{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.pg .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;row-gap:26px}
.pg .cell{display:flex;flex-direction:column;gap:10px}
.pg .cap{display:flex;flex-direction:column;gap:3px}
.pg .cap h2{margin:0;font-size:16px;font-weight:600}
.pg .cap p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.pg .tag{display:inline-block;min-width:22px;text-align:center;margin-right:8px;padding:1px 6px;border-radius:7px;background:rgba(124,155,255,.18);color:#B9C9FF;font-size:12px;font-weight:700}
.pg .tag.now{background:rgba(255,255,255,.10);color:var(--muted)}
.strip{position:relative;width:600px;height:210px;box-sizing:border-box;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.hr{position:absolute;top:10px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.ax{position:absolute;left:0;right:0;top:34px;height:1px;background:var(--line)}
.gd{position:absolute;top:35px;bottom:0;width:1px;background:rgba(255,255,255,.06)}
.gd.half{background:rgba(255,255,255,.03)}
.mt{position:absolute;box-sizing:border-box;border-radius:8px;background:rgba(255,255,255,.10);color:var(--ink);display:flex;align-items:flex-start;gap:5px;padding:0 7px;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:600}
.mt svg{flex-shrink:0}
.mt.clip{line-height:18px;padding-top:0}
.mt.line22{line-height:22px;align-items:center}
.mt.name{font-size:11.5px;line-height:15px;padding:0 7px}
.bk{position:absolute;box-sizing:border-box;border-radius:12px;overflow:hidden;color:var(--ink)}
.bk b{display:block;font-size:15px;line-height:17px;font-weight:600}
.bk span{display:block;font-size:12px;line-height:15px;opacity:.85}
.bk.brk{background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 4px,transparent 4px 9px),var(--card);border:1px solid #3A4766;color:var(--muted)}
.chip{position:absolute;box-sizing:border-box;height:22px;border-radius:8px;display:flex;align-items:center;gap:5px;padding:0 8px;background:rgba(124,155,255,.18);border:1px solid rgba(124,155,255,.55);color:#B9C9FF;font-size:12px;font-weight:700}
.pop{position:absolute;box-sizing:border-box;border-radius:14px;background:var(--card2);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.45);padding:10px 12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.pop .ph{font-size:11.5px;font-weight:600;color:var(--muted)}
.pop .pr{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:600}
.pop .pr i{font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted);margin-left:auto}
.tip{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--card2);border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.45);padding:7px 10px;display:flex;flex-direction:column;gap:2px;z-index:5;font-size:12.5px;font-weight:600}
.tip i{font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted)}
</style>
</helmet>
<div class="pg" style="width: 1280px; height: 800px; padding: 34px 30px 30px; display: flex; flex-direction: column; gap: 26px; border-radius: 20px">
  <div>
    <h1>Three meetings stacked</h1>
    <p class="lead">Client call, Design review and Supplier check-in overlap from 11:30 to 12:00. Every strip is drawn at the app's zoom, 280px to the hour, with the meeting row above the day's blocks.</p>
  </div>
  <div class="grid">

    <figure style="margin: 0" class="cell">
      <div class="cap"><h2><span class="tag now">Now</span>Three lanes of 16px</h2><p>The stack splits the 48px row in three, so the labels are clipped along their lower edge.</p></div>
      <div class="strip">
        <span class="hr" style="left: 24px">11:00</span><span class="hr" style="left: 304px">12:00</span><span class="hr" style="left: 584px">13:00</span>
        <div class="ax"></div>
        <div class="gd" style="left: 24px"></div><div class="gd half" style="left: 164px"></div><div class="gd" style="left: 304px"></div><div class="gd half" style="left: 444px"></div><div class="gd" style="left: 584px"></div>
        <div class="mt clip" style="left: 27px; top: 44px; width: 274px; height: 15px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Client call</div>
        <div class="mt clip" style="left: 167px; top: 60px; width: 204px; height: 15px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Design review</div>
        <div class="mt clip" style="left: 237px; top: 76px; width: 204px; height: 15px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Supplier check-in</div>
        <div class="bk" style="left: -29px; top: 106px; width: 274px; height: 70px; padding: 10px 12px; background: color-mix(in srgb, #94BF9B 45%, #1A2234)"><b>01:00</b><span>Account two</span></div>
        <div class="bk" style="left: 251px; top: 106px; width: 157px; height: 70px; padding: 10px 12px; background: color-mix(in srgb, #BAA4CE 45%, #1A2234)"><b>00:35</b><span>Account four</span></div>
        <div class="bk brk" style="left: 349px; top: 106px; width: 134px; height: 70px; padding: 10px 12px"><b>00:30</b><span>Break</span></div>
        <div class="bk" style="left: 489px; top: 106px; width: 181px; height: 70px; padding: 10px 12px; background: color-mix(in srgb, #D9A18A 45%, #1A2234)"><b>00:40</b><span>Account three</span></div>
      </div>
    </figure>

    <figure style="margin: 0" class="cell">
      <div class="cap"><h2><span class="tag">A</span>The row grows with the stack</h2><p>Lanes of 22px, so a day with three stacked meetings has a 74px row. The blocks below lose 26px of height.</p></div>
      <div class="strip">
        <span class="hr" style="left: 24px">11:00</span><span class="hr" style="left: 304px">12:00</span><span class="hr" style="left: 584px">13:00</span>
        <div class="ax"></div>
        <div class="gd" style="left: 24px"></div><div class="gd half" style="left: 164px"></div><div class="gd" style="left: 304px"></div><div class="gd half" style="left: 444px"></div><div class="gd" style="left: 584px"></div>
        <div class="mt line22" style="left: 27px; top: 44px; width: 274px; height: 22px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Client call</div>
        <div class="mt line22" style="left: 167px; top: 70px; width: 204px; height: 22px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Design review</div>
        <div class="mt line22" style="left: 237px; top: 96px; width: 204px; height: 22px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Supplier check-in</div>
        <div class="bk" style="left: -29px; top: 132px; width: 274px; height: 44px; padding: 4px 12px; background: color-mix(in srgb, #94BF9B 45%, #1A2234)"><b>01:00</b><span>Account two</span></div>
        <div class="bk" style="left: 251px; top: 132px; width: 157px; height: 44px; padding: 4px 12px; background: color-mix(in srgb, #BAA4CE 45%, #1A2234)"><b>00:35</b><span>Account four</span></div>
        <div class="bk brk" style="left: 349px; top: 132px; width: 134px; height: 44px; padding: 4px 12px"><b>00:30</b><span>Break</span></div>
        <div class="bk" style="left: 489px; top: 132px; width: 181px; height: 44px; padding: 4px 12px; background: color-mix(in srgb, #D9A18A 45%, #1A2234)"><b>00:40</b><span>Account three</span></div>
      </div>
    </figure>

    <figure style="margin: 0" class="cell">
      <div class="cap"><h2><span class="tag">B</span>Names only while stacked</h2><p>Lanes stay 16px and the cards drop the icon: name only, 11.5px. The times show on hover.</p></div>
      <div class="strip">
        <span class="hr" style="left: 24px">11:00</span><span class="hr" style="left: 304px">12:00</span><span class="hr" style="left: 584px">13:00</span>
        <div class="ax"></div>
        <div class="gd" style="left: 24px"></div><div class="gd half" style="left: 164px"></div><div class="gd" style="left: 304px"></div><div class="gd half" style="left: 444px"></div><div class="gd" style="left: 584px"></div>
        <div class="mt name" style="left: 27px; top: 44px; width: 274px; height: 15px">Client call</div>
        <div class="mt name" style="left: 167px; top: 60px; width: 204px; height: 15px; background: rgba(124,155,255,.22); box-shadow: 0 0 0 1.5px rgba(124,155,255,.6)">Design review</div>
        <div class="mt name" style="left: 237px; top: 76px; width: 204px; height: 15px">Supplier check-in</div>
        <div class="bk" style="left: -29px; top: 106px; width: 274px; height: 70px; padding: 10px 12px; background: color-mix(in srgb, #94BF9B 45%, #1A2234)"><b>01:00</b><span>Account two</span></div>
        <div class="bk" style="left: 251px; top: 106px; width: 157px; height: 70px; padding: 10px 12px; background: color-mix(in srgb, #BAA4CE 45%, #1A2234)"><b>00:35</b><span>Account four</span></div>
        <div class="bk brk" style="left: 349px; top: 106px; width: 134px; height: 70px; padding: 10px 12px"><b>00:30</b><span>Break</span></div>
        <div class="bk" style="left: 489px; top: 106px; width: 181px; height: 70px; padding: 10px 12px; background: color-mix(in srgb, #D9A18A 45%, #1A2234)"><b>00:40</b><span>Account three</span></div>
        <div class="tip" style="left: 190px; top: 96px"><span>Design review</span><i>11:30–12:15 · #Account three</i></div>
      </div>
    </figure>

    <figure style="margin: 0" class="cell">
      <div class="cap"><h2><span class="tag">C</span>Two lanes and a +1</h2><p>The row keeps its 48px, with two lanes of 22px. Anything past two folds into a +1 that opens a short list.</p></div>
      <div class="strip">
        <span class="hr" style="left: 24px">11:00</span><span class="hr" style="left: 304px">12:00</span><span class="hr" style="left: 584px">13:00</span>
        <div class="ax"></div>
        <div class="gd" style="left: 24px"></div><div class="gd half" style="left: 164px"></div><div class="gd" style="left: 304px"></div><div class="gd half" style="left: 444px"></div><div class="gd" style="left: 584px"></div>
        <div class="mt line22" style="left: 27px; top: 44px; width: 274px; height: 22px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Client call</div>
        <div class="mt line22" style="left: 167px; top: 70px; width: 204px; height: 22px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Design review</div>
        <div class="chip" style="left: 309px; top: 44px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>+1</div>
        <div class="bk" style="left: -29px; top: 106px; width: 274px; height: 70px; padding: 10px 12px; background: color-mix(in srgb, #94BF9B 45%, #1A2234)"><b>01:00</b><span>Account two</span></div>
        <div class="bk" style="left: 251px; top: 106px; width: 157px; height: 70px; padding: 10px 12px; background: color-mix(in srgb, #BAA4CE 45%, #1A2234)"><b>00:35</b><span>Account four</span></div>
        <div class="bk brk" style="left: 349px; top: 106px; width: 134px; height: 70px; padding: 10px 12px"><b>00:30</b><span>Break</span></div>
        <div class="bk" style="left: 489px; top: 106px; width: 181px; height: 70px; padding: 10px 12px; background: color-mix(in srgb, #D9A18A 45%, #1A2234)"><b>00:40</b><span>Account three</span></div>
        <div class="pop" style="left: 309px; top: 72px; width: 250px"><span class="ph">1 more meeting</span><div class="pr">Supplier check-in<i>11:45–12:30</i></div></div>
      </div>
    </figure>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

}
</script>
</body>
</html>
