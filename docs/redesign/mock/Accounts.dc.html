<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts drawer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.root{--bg1:#F4F4F1;--bg2:#ECECE8;--card:#FFFFFF;--card2:#F7F7F5;--line:#E2E2DD;--ink:#18233A;--muted:#5A6070;--accent:#3558C8;--accentInk:#FFFFFF;--soft:#E8EEFF;--grid:#EAEAE6;--shadow:0 1px 2px rgba(30,30,20,.06);--rail1:#FFFFFF;--rail2:#F6F6F4;--railLine:#E2E2DD;--railIcon:#858994;--railOn:#D3DDF0;--railOnInk:#5A6070;--railHover:#EDEDEA;--railDivider:#E2E2DD;--clock:#18233A;--clockSec:#5A6070;--amber:#E07A10;--amberSoft:#FFF1D6;--flag:#C93A3A;--lateInk:#B3363F;--lateBg:#FDECEC;--liveTint:#F1FBF7;--barNeutral:#6E727C;--track:#EAEAE6;--hatchA:#F1F1EE;--hatchB:#E3E3DF;--meetBg:#F7F7F5;--meetLine:#8FA2D6;--scroll:#C9C9C4}
.root.dark{--bg1:#0F1420;--bg2:#131A2A;--card:#1A2234;--card2:#212B42;--line:#2D3853;--ink:#EEF2FB;--muted:#A7B2CA;--accent:#7C9BFF;--accentInk:#0E1530;--soft:#25335A;--grid:#252F48;--shadow:0 1px 2px rgba(0,0,0,.25);--rail1:#1C2334;--rail2:#121826;--railLine:#2E3852;--railIcon:#C8D1E6;--railOn:#25335A;--railOnInk:#EEF2FB;--railHover:rgba(255,255,255,.10);--railDivider:#2E3852;--clock:#F3F6FF;--clockSec:#A9B5CF;--amber:#FF9A3C;--amberSoft:#3A2E14;--flag:#FF9A9A;--lateInk:#FF9A9A;--lateBg:#3A2226;--liveTint:#183029;--barNeutral:#8793B0;--track:#252F48;--hatchA:#222B42;--hatchB:#2B3652;--meetBg:#1F2940;--meetLine:#5E72A4;--scroll:#46526F}
.root{color-scheme:light}.root.dark{color-scheme:dark}
:where(.root) button{font:inherit;color:inherit;cursor:pointer}
.root button:focus-visible,.root input:focus-visible,.root a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-size:14px;font-weight:500;text-decoration:none}
.ctl:hover{background:var(--card2)}
.nav{width:40px;height:40px;border-radius:13px;border:0;background:transparent;color:var(--railIcon);display:flex;align-items:center;justify-content:center;padding:0}
a.nav{text-decoration:none}
.nav:hover{background:var(--railHover);color:var(--ink)}
.nav.on{background:var(--railOn);color:var(--railOnInk)}
.play{width:44px;height:44px;border-radius:14px;border:0;padding:0;color:#10281F;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 2px rgba(20,30,60,.18);display:flex;align-items:center;justify-content:center}
.brk{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--amber);display:flex;align-items:center;justify-content:center;padding:0}
.brk:hover{background:var(--amberSoft)}
.root{--live:#1F8F5F;--ovt:#D9363E}
.root.dark{--live:#34D399;--ovt:#FF7A7A}
.play{--tone:var(--live);color:var(--tone);background:color-mix(in srgb,var(--tone) 20%,transparent);box-shadow:none;transition:background .15s ease}
.play:hover{background:color-mix(in srgb,var(--tone) 32%,transparent)}
.brk{background:color-mix(in srgb,var(--amber) 16%,transparent);transition:background .15s ease}
.brk:hover{background:color-mix(in srgb,var(--amber) 28%,transparent)}
.brk.on{background:var(--amber);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 32%,transparent)}
.root.dark .brk.on{color:#2A1A05}
.accT{background:color-mix(in srgb,var(--ink) 5%,transparent);transition:background .15s ease}
.accT:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.accT.open{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;display:block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(96,150,255,.75)}70%{box-shadow:0 0 0 7px rgba(96,150,255,0)}100%{box-shadow:0 0 0 0 rgba(96,150,255,0)}}
.dot.pulse{animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.dot.pulse{animation:none}}
.clockBtn{border:0;background:transparent;padding:6px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--clock);line-height:1}
.clockBtn:hover{background:var(--railHover)}
.acctPanel{position:absolute;left:86px;top:190px;width:292px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(20,30,70,.16);padding:14px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
.acctPanel:before{content:"";position:absolute;left:-6px;top:38px;width:10px;height:10px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.acctRow{display:flex;align-items:center;gap:10px;padding:6px;border:0;border-radius:12px;background:transparent;text-align:left;width:100%}
.acctRow:hover{background:var(--card2)}
.playSq{width:36px;height:36px;border-radius:11px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink);box-sizing:border-box}
.playSq.run{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.acctRow:hover .playSq{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.nav.open{background:var(--soft)}
.mgr{border:0;background:transparent;color:var(--railIcon);display:flex;align-items:center;justify-content:center;padding:0;border-radius:12px;flex-shrink:0;width:38px;height:38px;text-decoration:none;transition:background .15s ease,color .15s ease}
.mgr:hover{background:var(--railHover);color:var(--ink)}

.field{height:34px;box-sizing:border-box;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px;padding:0 10px;font:400 14px 'Inter',system-ui,sans-serif}
.nav svg,.ctl svg,.brk svg{transition:transform .2s ease}
.nav.quit:hover{background:var(--lateBg);color:var(--lateInk)}
.nav.finish .cloth{transform-box:fill-box;transform-origin:0 50%}
.nav.finish:hover .cloth{animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}25%{transform:skewY(-9deg) scaleX(.93)}50%{transform:skewY(0) scaleX(1.04)}75%{transform:skewY(9deg) scaleX(.93)}}
@media (prefers-reduced-motion:reduce){.nav.finish:hover .cloth{animation:none}}
.nav.quit:hover svg{transform:scale(1.14)}
.brk:hover .steam{animation:steam 1.4s ease-in-out infinite}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-1.6px);opacity:.45}}
@media (prefers-reduced-motion:reduce){.nav svg,.ctl svg,.brk svg{transition:none}.brk:hover .steam{animation:none}}
.root *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.root *::-webkit-scrollbar{width:10px;height:10px}
.root *::-webkit-scrollbar-track{background:transparent}
.root *::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid transparent;background-clip:content-box}
.root *::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
.cap{width:6px;height:14px;border-radius:3px;display:block;flex-shrink:0}
.cap.pulse{animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.cap.pulse{animation:none}}
svg.ri{display:block;fill:currentColor}
.ri .tk,.ri .xa,.ri .xb{stroke-dashoffset:0}
.ri .xa,.ri .xb{opacity:0;stroke-dashoffset:10}
.ri .c{transform-box:fill-box;transform-origin:50% 100%}
@keyframes wigA{0%,100%{transform:translateX(0)}30%{transform:translateX(1.6px)}70%{transform:translateX(-1.6px)}}
@keyframes wigB{0%,100%{transform:translateX(0)}35%{transform:translateX(-1.6px)}75%{transform:translateX(1.4px)}}
@keyframes wigC{0%,100%{transform:translateX(0)}25%{transform:translateX(1.4px)}65%{transform:translateX(-1.7px)}}
@keyframes spring{0%{transform:scaleY(1)}10%{transform:scaleY(1.34)}22%{transform:scaleY(.94)}32%{transform:scaleY(1.08)}42%,100%{transform:scaleY(1)}}
@keyframes tkCycle{0%,3%{opacity:1;stroke-dashoffset:0}11%{opacity:0;stroke-dashoffset:0}56%{opacity:0;stroke-dashoffset:10}68%,100%{opacity:1;stroke-dashoffset:0}}
@keyframes xCycle{0%,10%{opacity:0;stroke-dashoffset:10}20%,48%{opacity:1;stroke-dashoffset:0}56%{opacity:0;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:10}}
@media (prefers-reduced-motion:no-preference){
.nav:hover .b1{animation:wigA 2.2s ease-in-out infinite}
.nav:hover .b2{animation:wigB 2.7s ease-in-out infinite}
.nav:hover .b3{animation:wigC 2.4s ease-in-out infinite}
.nav:hover .c1{animation:spring 2.6s ease-out infinite}
.nav:hover .c2{animation:spring 2.6s ease-out .45s infinite}
.nav:hover .c3{animation:spring 2.6s ease-out .9s infinite}
.nav:hover .tk{animation:tkCycle 3.2s ease-in-out infinite}
.nav:hover .xa{animation:xCycle 3.2s ease-in-out infinite}
.nav:hover .xb{animation:xCycle 3.2s ease-in-out .1s infinite}
}
/* the primary control and the Accounts button share one soft well, with the break below at the foot */
.well{width:54px;box-sizing:border-box;padding:4px;border-radius:20px;background:color-mix(in srgb,var(--ink) 5.5%,transparent);display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px}
.dark .well{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.well .play{width:46px;margin-top:0}
.well .accT{width:46px;background:transparent}
.well .accT:hover{background:var(--hover)}
.well .accT.open{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.dark .well .accT.open{background:color-mix(in srgb,var(--accent) 22%,transparent)}
</style>
</helmet>
<div class="root {{modeClass}}" style="width: 1100px; height: 720px; box-sizing: border-box; display: flex; position: relative; overflow: hidden; border-radius: 20px; background: linear-gradient(135deg, var(--bg1), var(--bg2)); font-family: 'Inter', system-ui, sans-serif; color: var(--ink)">

  <nav aria-label="Timer and navigation" style="position: relative; z-index: 45; width: 76px; flex-shrink: 0; height: 100%; box-sizing: border-box; padding: 14px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(180deg, var(--rail1), var(--rail2)); border-right: 1px solid var(--railLine)">
    <div style="display: flex; gap: 6px; align-items: center; height: 14px" role="group" aria-label="Recording and reminder status">
      <span class="cap" role="img" aria-label="Recording" style="background: #34D399"></span>

    </div>
    <button class="clockBtn" aria-label="Collapse to the pill. Working time 04:47:35" title="Collapse to the pill" style="margin-top: 4px">
      <span style="font-size: 30px; font-weight: 700">04</span>
      <span style="font-size: 30px; font-weight: 700; margin-top: 2px">47</span>
      <span style="font-size: 15px; font-weight: 600; margin-top: 4px; color: var(--clockSec)">35</span>
    </button>
    <div class="well">
    <button class="play" aria-label="{{playLabel}}"><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 17px">{{runIni}}</span></button>
    <button class="nav accT open" aria-label="Accounts" aria-expanded="true" title="Close the accounts" style="width: 46px; height: 44px; border-radius: 14px"><span style="display: flex; flex-direction: column; gap: 3px" aria-hidden="true"><span style="width: 20px; height: 5px; border-radius: 3px; background: linear-gradient(135deg,#A8D4FF,#7F98F7)"></span><span style="width: 20px; height: 5px; border-radius: 3px; background: linear-gradient(135deg,#B2EFD6,#5FD6AE)"></span><span style="width: 20px; height: 5px; border-radius: 3px; background: linear-gradient(135deg,#FFD9B8,#FF9F84)"></span></span></button>
    </div>
    <button class="brk" aria-label="Start break" title="Start break"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path class="steam" d="M8 3v2M12 3v2"/></svg></button>
    <div style="width: 30px; height: 1px; background: var(--railDivider); margin: 4px 0 2px"></div>
    <a class="nav" href="Main.dc.html" aria-label="Timeline" title="Timeline"><svg class="ri" width="22" height="22" viewBox="0 0 18 18" aria-hidden="true"><rect class="b1" x="2.5" y="3.6" width="8.5" height="3" rx="1.5"/><rect class="b2" x="6.5" y="7.6" width="9" height="3" rx="1.5"/><rect class="b3" x="4" y="11.6" width="6.5" height="3" rx="1.5"/></svg></a>
    <a class="nav" href="Notes.dc.html" aria-label="Notes" title="Notes"><svg class="ri" width="22" height="22" viewBox="0 0 18 18" aria-hidden="true"><defs><mask id="mkn1a" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><path class="tk" pathLength="10" d="M3.2 5.05L4.6 6.45L6.9 3.65" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10"/></mask><mask id="mkn1b" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><path class="xa" pathLength="10" d="M3.9 12.1L6.1 14.3" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="10"/><path class="xb" pathLength="10" d="M6.1 12.1L3.9 14.3" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="10"/></mask></defs><rect x="1.8" y="2" width="6.4" height="6.4" rx="1.8" mask="url(#mkn1a)"/><rect x="1.8" y="10" width="6.4" height="6.4" rx="1.8" mask="url(#mkn1b)"/><path d="M10.4 5.2h5.2 M10.4 13.2h5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></a>
    <a class="nav" href="Week.dc.html" aria-label="Week overview" title="Week overview"><svg class="ri" width="22" height="22" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 15.8h14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><rect class="c c1" x="2.8" y="8.6" width="2.8" height="5.6" rx="1.4"/><rect class="c c2" x="7.6" y="4.6" width="2.8" height="9.6" rx="1.4"/><rect class="c c3" x="12.4" y="7" width="2.8" height="7.2" rx="1.4"/></svg></a>
    <div style="flex-grow: 1"></div>
    <button class="nav finish" aria-label="Finish day" title="Finish day" style="color: var(--flag)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path class="cloth" d="M5 5h13l-3 4 3 4H5"/></svg></button>
    <div style="width: 30px; height: 1px; background: var(--railDivider); margin: 2px 0"></div>
    <button class="nav quit" aria-label="Close timer" title="Close timer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </nav>

  <div aria-hidden="true" style="position: absolute; left: 76px; top: 0; right: 0; bottom: 0; background: rgba(24,35,58,.18); z-index: 40"></div>
    <aside class="acctDrawer" role="dialog" aria-label="Accounts" style="position: absolute; left: 76px; top: 0; bottom: 0; width: 300px; z-index: 42; box-sizing: border-box; padding: 20px 14px; background: linear-gradient(180deg, var(--rail1), var(--rail2)); border-right: 1px solid var(--railLine); box-shadow: 8px 0 28px rgba(20,30,70,.16); display: flex; flex-direction: column; gap: 6px">
      <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 10px"><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 24px; font-weight: 700">Accounts</span><a class="mgr" href="AccountsDialog.dc.html" aria-label="Manage accounts" title="Manage accounts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></a></div>
      <sc-for list="{{rows}}" as="a" hint-placeholder-count="5">
        <button class="acctRow" onClick="{{a.pick}}" style="{{a.rowStyle}}" aria-pressed="{{a.running}}">
          <span style="flex-grow: 1; min-width: 0; display: block">
            <span style="display: flex; justify-content: space-between; gap: 6px; align-items: center"><span style="display: flex; align-items: center; gap: 7px; min-width: 0"><span style="{{a.dot}}"></span><span style="font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</span></span><span style="font-size: 13.5px; font-weight: 700">{{a.time}}</span></span>
            <span style="display: block; font-size: 11.5px; margin-top: 2px; {{a.subStyle}}">{{a.sub}}</span>
            <sc-if value="{{a.hasBar}}" hint-placeholder-val="{{ true }}"><span style="display: block; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 5px"><span style="{{a.bar}}"></span></span></sc-if>
          </span>
          <span class="playSq {{a.sqCls}}" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="{{a.sqIcon}}"/></svg></span>
        </button>
      </sc-for>
    </aside>

  <main style="flex-grow: 1; min-width: 0; padding: 20px 22px 20px 20px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <header style="display: flex; align-items: center; gap: 10px; height: 44px">
      <h1 style="margin: 0 auto 0 4px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">Today</h1>
      <button class="ctl" aria-label="Notifications" style="width: 42px; padding: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg></button>
      <button class="ctl gear" aria-label="Settings" style="width: 38px; padding: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <section aria-label="Timeline" style="background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 34px 16px; height: 250px; box-sizing: border-box; position: relative">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 500"><span>08:00</span><span>10:00</span><span>12:00</span><span>14:00</span><span>16:00</span><span>18:00</span></div>
      <div style="position: relative; height: 150px; margin-top: 14px">
        <div style="position: absolute; left: 6%; width: 15%; top: 30px; height: 76px; border-radius: 12px; background: linear-gradient(135deg,#A8D4FF,#7F98F7)"></div>
        <div style="position: absolute; left: 22%; width: 10%; top: 30px; height: 76px; border-radius: 12px; background: linear-gradient(135deg,#B2EFD6,#5FD6AE)"></div>
        <div style="position: absolute; left: 33%; width: 8%; top: 30px; height: 76px; border-radius: 12px; background: linear-gradient(135deg,#FFD9B8,#FF9F84)"></div>
        <div style="position: absolute; left: 44%; width: 10%; top: 30px; height: 76px; border-radius: 12px; background: repeating-linear-gradient(135deg,var(--hatchA) 0 6px,var(--hatchB) 6px 12px); border: 1px solid var(--line); box-sizing: border-box"></div>
        <div style="position: absolute; left: 55%; width: 6%; top: 30px; height: 76px; border-radius: 12px; background: linear-gradient(135deg,#E8D0FF,#C197F8)"></div>

<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:720}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { run: 4 };
  }
  renderVals() {
    const mode = this.props.mode ?? 'light';
    const accts = [
      { n: 'Account one', c: ['#A8D4FF', '#7F98F7'], t: '01:30', p: 88, sub: '08:48 of 10:00 this week' },
      { n: 'Account two', c: ['#B2EFD6', '#5FD6AE'], t: '01:00', p: 60, sub: '12:00 of 20:00 this month' },
      { n: 'Account three', c: ['#FFD9B8', '#FF9F84'], t: '00:45', p: 46, sub: '03:41 of 08:00 this week' },
      { n: 'Account four', c: ['#E8D0FF', '#C197F8'], t: '00:35', p: 110, sub: '16:30 of 15:00 this month' },
      { n: 'Account five', c: ['#EEF6B0', '#B9DF82'], t: '00:32', p: 0, sub: 'No budget' }
    ];
    const rows = accts.map((a, i) => ({ a: a, i: i })).map((o) => {
      const run = o.i === this.state.run;
      const p = o.a.p;
      return {
        name: o.a.n, time: o.a.t, sub: o.a.sub, running: run, hasBar: p > 0,
        dot: 'width:10px;height:10px;border-radius:50%;flex-shrink:0;background:' + o.a.c[1], sqCls: run ? 'run' : '', sqIcon: run ? 'M7 5h3.6v14H7zM13.4 5H17v14h-3.6z' : 'M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z',
        subStyle: p >= 100 ? 'color:var(--lateInk);font-weight:600' : 'color:var(--muted)',
        rowStyle: 'padding:8px 10px;' + (run ? 'background:var(--liveTint)' : ''),
        swatch: 'width:32px;height:32px;border-radius:10px;flex-shrink:0;display:block;background:linear-gradient(135deg,' + o.a.c[0] + ',' + o.a.c[1] + ')',
        bar: 'display:block;height:100%;width:' + Math.min(p, 100) + '%;background:' + (p >= 100 ? '#D64545' : p >= 80 ? '#E39A12' : 'var(--barNeutral)'),
        pick: () => this.setState({ run: o.i })
      };
    });
    return {
      modeClass: mode === 'dark' ? 'dark' : '',
      runIni: 'A' + (this.state.run + 1),
      playLabel: 'Pause. Tracking ' + accts[this.state.run].n,
      rows: rows
    };
  }
}
</script>
